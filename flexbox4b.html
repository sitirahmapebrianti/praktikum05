<!DOCTYPE html>
<html lang="id">
<head>
    <title>Flexbox Layout 4b</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #f8a5a5; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            gap: 15px;
            font-family: sans-serif;
            color: white;
            font-size: 20px;
        }
        header, footer { 
            background-color: #98d2c0; 
            padding: 20px; 
            text-align: center; 
        }
        .main { 
            display: flex; 
            flex: 1; 
            gap: 15px; 
        }
        aside { 
            width: 30%; 
            background-color: #62b1b1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        article { 
            flex: 1; 
            background-color: #f67272; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            gap: 20px;
        }
        .image-group { 
            display: flex; 
            width: 100%; 
            gap: 15px; 
        }
        .img-box { 
            flex: 1; 
            height: 150px; 
            background-color: #d3d3d3; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
    </style>
</head>
<body>
    <header>Header</header>
    <div class="main">
        <aside>Aside</aside>
        <article>
            <div>Article</div>
            <div class="image-group">
                <div class="img-box">Image</div>
                <div class="img-box">Image</div>
                <div class="img-box">Image</div>
            </div>
        </article>
    </div>
    <footer>Footer</footer>
</body>
</html>
