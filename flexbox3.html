<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox 3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 30px;
            background-color: #ffffff;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .box {
            flex: 1;
            height: 75px;
            background-color: #e0e0e0;
            border: 3px solid #222;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Baris 1: 3 Kotak -->
        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <!-- Baris 2: 5 Kotak -->
        <div class="row">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </div>

</body>
</html>
