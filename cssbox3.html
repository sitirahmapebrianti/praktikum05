<!DOCTYPE html>
<html>
<head>
    <title>CSS Box 3</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 15px; }
        .row { clear: both; margin-bottom: 15px; overflow: hidden; }
        .box { border: 1px solid black; }

        .kuning { width: 20%; height: 80px; background-color: #f4e842; float: left; }
        .merah { width: 78.5%; height: 80px; background-color: #ff5722; float: right; }
        
        .hijau { width: 20%; height: 400px; background-color: #a8d582; float: left; }
        .abu { width: 57%; height: 400px; background-color: #d3d3d3; float: left; margin: 0 1.5%; }
        .cyan { width: 20%; height: 400px; background-color: #4dd0e1; float: right; }
        
        .biru { width: 100%; height: 70px; background-color: #1976d2; }
    </style>
</head>
<body>
    <div class="row">
        <div class="box kuning"></div>
        <div class="box merah"></div>
    </div>
    <div class="row">
        <div class="box hijau"></div>
        <div class="box abu"></div>
        <div class="box cyan"></div>
    </div>
    <div class="row">
        <div class="box biru"></div>
    </div>
</body>
</html>
